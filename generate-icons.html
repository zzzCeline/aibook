<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>图标生成</title></head>
<body style="text-align:center;padding:40px;font-family:sans-serif;">
<h2>📚 AI书伴 - PWA图标生成器</h2>
<p>自动生成中...</p>
<canvas id="c" style="display:none"></canvas>
<script>
const canvas = document.getElementById('c');

function makeIcon(size) {
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // 圆角暖棕背景
    const r = size * 0.2;
    ctx.fillStyle = '#6B4226';
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.fill();

    // emoji 文字
    ctx.fillStyle = '#FFF';
    ctx.font = (size * 0.5).toFixed(0) + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('📚', size / 2, size / 2);

    return canvas.toDataURL('image/png');
}

function download(dataUrl, filename) {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// 生成并下载两个图标
setTimeout(() => {
    download(makeIcon(192), 'icon-192.png');
    setTimeout(() => {
        download(makeIcon(512), 'icon-512.png');
        document.querySelector('p').textContent = '✅ 图标已生成！将两个PNG文件放入 src/ 目录即可';
    }, 500);
}, 300);
</script>
</body>
</html>
