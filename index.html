<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AI书伴">
    <meta name="theme-color" content="#6B4226">
    <meta name="description" content="你的私人阅读AI助手">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <title>AI书伴</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

    <!-- ==================== 书架首页 ==================== -->
    <div class="page active" id="page-shelf">

        <!-- 顶部导航 -->
        <div class="top-nav">
            <span class="nav-title">📚 AI书伴</span>
        </div>

        <!-- 搜索框 -->
        <div class="search-area">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="搜索书名或作者..." autocomplete="off">
                <button class="search-clear" id="search-clear" onclick="this.classList.remove('visible');document.getElementById('search-input').value='';document.getElementById('search-results').classList.remove('visible');">✕</button>
            </div>
        </div>

        <!-- 搜索结果 -->
        <div class="search-results" id="search-results">
            <div class="results-label">搜索结果</div>
            <div class="book-grid" id="search-results-list"></div>
        </div>

        <!-- 书架 -->
        <div class="shelf-area">
            <div class="shelf-label">
                <span class="shelf-icon">📚</span>
                <span class="shelf-title">我的书架</span>
                <span class="shelf-count" id="shelf-count">0本</span>
            </div>

            <div class="book-grid" id="shelf-books"></div>

            <div class="empty-shelf" id="empty-shelf" style="display:none;">
                <span class="empty-icon">📖</span>
                <div class="empty-text">书架还是空的<br>在上方搜索并添加你的第一本书吧 ✨</div>
            </div>
        </div>
    </div>

    <!-- ==================== 阅读器页面 ==================== -->
    <div class="page reader-page" id="page-reader">

        <!-- 顶部导航 -->
        <div class="top-nav">
            <button class="nav-back" onclick="saveCurrentProgress(); goTo('shelf'); initShelf(); hideAskAiPopup();">&larr;</button>
            <span class="nav-title">
                <span id="reader-book-title">书名</span>
            </span>
        </div>

        <!-- 正文区域 -->
        <div class="reader-content" id="reader-content">
            <div class="chapter-title" id="reader-chapter-title"></div>
            <div class="chapter-text" id="reader-body"></div>

            <!-- 更多章节提示 -->
            <div class="more-hint" id="more-hint" style="display:none;">
                📖 更多章节开发中，敬请期待
            </div>
        </div>

        <!-- 章节导航 -->
        <div class="chapter-nav">
            <button id="chapter-prev" onclick="prevChapter()">← 上一章</button>
            <span class="chapter-indicator" id="chapter-indicator">1 / 1</span>
            <button id="chapter-next" onclick="nextChapter()">下一章 →</button>
        </div>

        <!-- 选中文字弹出按钮 -->
        <button class="ask-ai-popup" id="ask-ai-popup" onclick="askAI()">
            🤖 问AI
        </button>

        <!-- 右下角聊天入口 -->
        <button class="floating-chat-btn" onclick="openChat('')">
            💬
        </button>
    </div>

    <!-- ==================== 聊天室页面 ==================== -->
    <div class="page chat-page" id="page-chat">

        <!-- 顶部导航 -->
        <div class="top-nav">
            <button class="nav-back" onclick="saveCurrentProgress(); goTo('reader'); hideAskAiPopup();">&larr;</button>
            <span class="nav-title">
                📖 <span id="chat-book-title">书名</span>
            </span>
            <button class="nav-action" onclick="showCharacterPicker()" id="current-char-display">📚</button>
        </div>

        <!-- 消息区域 -->
        <div class="chat-messages" id="chat-messages">
            <div class="chat-empty" id="chat-empty" style="display:none;">
                <span class="empty-emoji">💬</span>
                <div class="empty-hint">
                    开始和AI讨论这本书吧<br>
                    你可以在阅读时长按选中文字<br>然后点击"🤖 问AI"进入
                </div>
            </div>
        </div>

        <!-- AI输入中 -->
        <div class="typing-indicator" id="typing-indicator">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- 底部输入栏 -->
        <div class="chat-input-bar">
            <input type="text" id="chat-input" placeholder="输入你的问题..." autocomplete="off">
            <button class="btn-send" id="btn-send" onclick="sendMessage()">➤</button>
        </div>
    </div>

</div>

<!-- ==================== 删除确认弹窗 ==================== -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">🗑️</div>
        <div class="modal-text" id="modal-text"></div>
        <div class="modal-sub">聊天记录也会一起删除</div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="cancelDelete()">取消</button>
            <button class="btn-confirm" onclick="confirmDelete()">确认删除</button>
        </div>
    </div>
</div>

<!-- ==================== 角色选择弹窗 ==================== -->
<div class="character-modal" id="character-modal" onclick="if(event.target===this) hideCharacterPicker();">
    <div class="character-panel">
        <div class="panel-title">选择AI回复风格</div>
        <div class="character-option" data-char="author" onclick="selectCharacter('author')">
            <span class="char-emoji">📚</span>
            <div class="char-info">
                <div class="char-name">作者本人</div>
                <div class="char-desc">温和、深刻，像作者在和你聊天</div>
            </div>
        </div>
        <div class="character-option" data-char="professor" onclick="selectCharacter('professor')">
            <span class="char-emoji">🎓</span>
            <div class="char-info">
                <div class="char-name">文学教授</div>
                <div class="char-desc">学术角度，严谨但有启发性</div>
            </div>
        </div>
        <div class="character-option" data-char="critic" onclick="selectCharacter('critic')">
            <span class="char-emoji">🔥</span>
            <div class="char-info">
                <div class="char-name">毒舌书评人</div>
                <div class="char-desc">幽默犀利，一针见血</div>
            </div>
        </div>
        <div class="character-option" data-char="partner" onclick="selectCharacter('partner')">
            <span class="char-emoji">🤝</span>
            <div class="char-info">
                <div class="char-name">同读伙伴</div>
                <div class="char-desc">像一个和你一起读书的朋友</div>
            </div>
        </div>
        <div style="text-align:center;margin-top:8px;">
            <button class="btn-cancel" style="background:var(--light-gray);border:none;padding:10px 40px;border-radius:20px;font-size:14px;cursor:pointer;" onclick="hideCharacterPicker()">取消</button>
        </div>
    </div>
</div>

<!-- ==================== 脚本（顺序很重要） ==================== -->
<script src="config.js"></script>
<script src="books.js"></script>
<script src="app.js"></script>

</body>
</html>
